experiment: probes-rosch-qwen2-5-1-5B
title: "Typicality probes on Rosch prompts: Qwen2.5-1.5B, layer 15, period token"
model: Qwen/Qwen2.5-1.5B
# One row for each item and prompt category: 565 x 10 = 5650 rows. The probes
# use only the 565 target rows. The other rows give the mean contrast baseline.
prompts_csv: data/processed/rosch/rosch_mean_contrast.csv
prompt_columns:
  - rosch_example
  - rosch_neg
  - rosch_simple
  - rosch_fav
  - rosch_story_1
  - rosch_story_2
  - rosch_story_neg
# Extraction settings. These are part of the activation cache key. They are the
# same as the PCA mean-contrast run, so the activations come from the cache.
# Layer L is the residual stream after transformer block L (hidden_states[L]).
layers: [10, 15, 20, 25]
positions: [period]
# The activations that the probes use.
probe_layer: 15
probe_position: period
# One set of heatmaps for each baseline, side by side. null is no baseline.
# mean_contrast: a(i, c) - mean over c' != c of a(i, c'). See baselines.py.
baselines: [null, mean_contrast]
# Typicality = target_sign x target. A low rating is typical, so the sign is -1
# and a higher typicality value is more typical.
target: rating_zscore
target_sign: -1
probe_types: [diff_of_means, ridge]
metrics: [spearman, pearson]
# Folds are made in each category, stratified by typicality. The same items are
# in each fold for all prompts.
n_folds: 5
# pooled: correlation of all out-of-fold predictions.
# mean_over_folds: mean of the correlations of each held-out fold.
cv_aggregate: pooled
# Ridge alpha is chosen from this grid by inner CV on the training items only.
ridge_alphas: [1.0, 3.16, 10.0, 31.6, 100.0, 316.0, 1000.0, 3160.0, 10000.0, 31600.0, 100000.0, 316000.0, 1000000.0]
ridge_inner_folds: 5
# Standardise each feature with the mean and std of the training items.
ridge_standardise: true
batch_size: 16
device: auto
dtype: float32
# Token put before every prompt. Qwen2.5 adds no start token.
prefix_token: "<|endoftext|>"
seed: 0
activation_cache_dir: outputs/activation_cache
max_rows: null
output_dir: outputs/probes/rosch/qwen2-5-1-5B
html_name: qwen2-5-1-5B-probes.html
