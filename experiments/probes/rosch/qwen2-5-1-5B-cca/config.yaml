experiment: probes-rosch-qwen2-5-1-5B-cca
title: "Contrastive activation addition directions on Rosch prompts: Qwen2.5-1.5B, layer 15, period token"
model: Qwen/Qwen2.5-1.5B
# Same data and extraction settings as qwen2-5-1-5B-diff-means, so the
# activations come from the cache.
prompts_csv: data/processed/rosch/rosch_mean_cat_contrast.csv
prompt_columns:
  - rosch_example
  - rosch_neg
  - rosch_simple
  - rosch_fav
  - rosch_story_1
  - rosch_story_2
  - rosch_story_neg
layers: [10, 15, 20, 25]
positions: [period]
probe_layer: 15
probe_position: period
# null is no baseline. mean_contrast: a(i, c) - mean over c' != c of a(i, c').
baselines: [null, mean_contrast]
# Typicality = target_sign x target. A low rating is typical.
target: rating_zscore
target_sign: -1
metrics: [spearman, pearson]
n_folds: 5
cv_aggregate: pooled
# CAA direction of a category: mean activation of the top third minus the
# bottom third of its items, pooled over all training prompts. No weighting.
n_groups: 3
# include: all items. exclude: remove items with is_ambiguous true.
ambiguous: [include]
# Evaluation prompts: never used for training. Raw activations (no baseline).
eval_prompts_csv: data/processed/rosch/rosch_eval.csv
eval_prompt_columns:
  - rosch_eval_1
  - rosch_eval_2
  - rosch_eval_3
batch_size: 16
device: auto
dtype: float32
prefix_token: "<|endoftext|>"
seed: 0
activation_cache_dir: outputs/activation_cache
max_rows: null
output_dir: outputs/probes/rosch/qwen2-5-1-5B-cca
html_name: cca.html
