experiment: probes-rosch-qwen2-5-1-5B-format-variance
title: "Format variance removal on Rosch prompts: Qwen2.5-1.5B, layer 15, period token"
model: Qwen/Qwen2.5-1.5B
# Same data and extraction settings as qwen2-5-1-5B-diff-means, so the
# activations come from the cache.
prompts_csv: data/processed/rosch/rosch_mean_cat_contrast.csv
prompt_columns:
  - rosch_example
  - rosch_neg
  - rosch_simple
  - rosch_fav
  - rosch_story_1
  - rosch_story_2
  - rosch_story_neg
layers: [10, 15, 20, 25]
positions: [period]
probe_layer: 15
probe_position: period
# null is no baseline. mean_contrast: a(i, c) - mean over c' != c of a(i, c').
baselines: [null, mean_contrast]
# Typicality = target_sign x target. A low rating is typical.
target: rating_zscore
target_sign: -1
metrics: [spearman, pearson]
n_folds: 5
cv_aggregate: pooled
# Difference of means: top and bottom thirds, no weighting.
n_groups: 3
ambiguous: [include, exclude]
# Preprocessing variants (see format_variance_experiment.py).
variants: [raw, center, inlp, leace, center_inlp, center_leace]
# INLP: at most inlp_iterations steps. A step is not done when the dev
# accuracy of its format classifier is below inlp_stop_accuracy (chance is
# 1/7 = 0.143). null: always do all steps.
inlp_iterations: 20
inlp_stop_accuracy: 0.2
# Logistic regression for INLP and for the format check.
classifier_c: 1.0
classifier_max_iter: 1000
classifier_dev_fraction: 0.3
# Fit a new format classifier on each preprocessed set and record its dev accuracy.
format_check: true
# Evaluation prompts: never used for training or for fitting the eraser.
eval_prompts_csv: data/processed/rosch/rosch_eval.csv
eval_prompt_columns:
  - rosch_eval_1
  - rosch_eval_2
  - rosch_eval_3
batch_size: 16
device: auto
dtype: float32
prefix_token: "<|endoftext|>"
seed: 0
activation_cache_dir: outputs/activation_cache
max_rows: null
output_dir: outputs/probes/rosch/qwen2-5-1-5B-format-variance
html_name: format-variance.html
