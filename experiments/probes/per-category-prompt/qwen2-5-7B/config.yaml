experiment: global-direction-probes-per-category-prompt-qwen2-5-7B
title: "Rosch difference-of-means probes by activation type: Qwen2.5-7B, period token"
model: Qwen/Qwen2.5-7B
# Baselines are used only for training. All probe scores (transfer cells,
# held-out items, evaluation prompts) use the raw activations.
# Raw and category contrast activations (target rows give the raw activations).
cat_contrast_csv: data/processed/rosch/rosch_mean_cat_contrast.csv
# Item contrast: 9 contrast items per pair (seed 0).
item_contrast_csv: data/processed/rosch/rosch_mean_item_contrast.csv
# The 15 training prompt formats (the evaluation formats have no item contrast file).
prompt_columns:
  - rosch_example
  - rosch_neg
  - rosch_simple
  - rosch_fav
  - rosch_story_1
  - rosch_story_2
  - rosch_story_neg
  - rosch_typ_frame_1
  - rosch_typ_frame_2
  - rosch_typ_frame_3
  - rosch_hedge_1
  - rosch_hedge_2
  - rosch_hedge_3
  - rosch_cat_first_1
  - rosch_cat_first_2
# Extraction settings (part of the activation cache key), the same as
# experiments/activations/qwen2-5-7B.
layers: [10, 15, 20, 25]
position: period
batch_size: 16
device: auto
dtype: float32
prefix_token: "<|endoftext|>"
activation_cache_dir: outputs/activation_cache
# include: all items. exclude_core / exclude_extended: remove the items with
# is_ambiguous_core / is_ambiguous_extended true from training and evaluation.
ambiguity: [include, exclude_core, exclude_extended]
# Difference of means: most typical 1/n minus least typical 1/n of the training
# items. 2: halves, 3: thirds, 4: quarters.
n_groups: [2, 3, 4]
# wilcoxon_auc: rank-sum AUC of the most vs least typical 1/n of the eval items.
metrics: [spearman, pearson, wilcoxon_auc]
# Folds are made in each category, stratified by typicality, and are the same
# for all prompts and activation types.
n_folds: 5
# fold_zscored: z-score the out-of-fold scores in each fold before the metric.
cv_aggregate: fold_zscored
# diagonal: the method for the diagonal cells of the transfer matrices.
# full: the probe trained on all items, evaluated on the same items
# (in-sample). cv: each fold probe on its held-out items. The off-diagonal
# cells do not change.
diagonal: full
# Typicality = target_sign x target. A low rating is typical.
target: rating_zscore
target_sign: -1
seed: 0
output_dir: outputs/probes/global-direction/per-category-prompt/qwen2-5-7B
html_name: qwen2-5-7B-probes-01.html
# A copy of the page goes here (in .gitignore). null: no copy.
copy_html_to: experiments/probes/per-category-prompt
