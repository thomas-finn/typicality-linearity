experiment: steering-st-01
title: "Steering along the general typicality direction: Qwen2.5-1.5B, layer 15"
model: Qwen/Qwen2.5-1.5B
# Direction source: the diff-of-means run with the evaluation prompts.
source_run_dir: outputs/probes/rosch/qwen2-5-1-5B-diff-means/20261105T123218Z_probes-rosch-qwen2-5-1-5B-diff-means
# The setting (split, weight constant, ambiguous, baseline) with the highest
# value of this statistic in summary.csv. mean_all_eval: the mean direction over
# all categories and training prompts, scored on the 3 evaluation prompts.
selection_statistic: mean_all_eval
selection_metric: spearman
# One prompt for each Rosch item. {category}: the category with its determiner
# ("a fruit", "clothing"). {item}: "the" + item for count nouns and plurals,
# the item alone for mass nouns and sports ("spinach", "swimming"). {be}: is/are.
# BLANK is filled with each pole word. Each pole word must be one token.
prompts_csv: data/processed/rosch/rosch_prompts.csv
# Only the items of these categories (null: all categories).
categories: null
max_rows: null
template: "As an example of {category}, {item} {be} fairly BLANK"
typical_poles: [typical, standard, representative]
atypical_poles: [poor, rare, odd]
# hidden_states[layer]: the same layer as the probes.
layer: 15
# item: the last token of the item in each prompt. (Also supported: all = all tokens except
# the prefix token; last = the token before BLANK.)
steer_modes: [item]
# alpha: the added vector is alpha x (mean residual norm at the steered
# positions, before steering) x unit direction. Must contain 0.
# 9 values, to make the run shorter.
steering_constants: [-1.0, -0.5, -0.2, -0.1, 0.0, 0.1, 0.2, 0.5, 1.0]
# Control: random unit directions with the same constants.
n_random_directions: 3
n_top_tokens: 5
batch_size: 16
device: auto
dtype: float32
# The same prefix token as the activation extraction of the probes.
prefix_token: "<|endoftext|>"
seed: 0
output_dir: outputs/steering/st-01
html_name: st-01.html
