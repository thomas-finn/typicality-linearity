experiment: pca-rosch-qwen2-5-1-5B-mean-contrast
title: "PCA of Rosch prompts: Qwen2.5-1.5B, mean contrast baseline"
model: Qwen/Qwen2.5-1.5B
# One row for each item and prompt category: 565 x 10 = 5650 rows.
prompts_csv: data/processed/rosch/rosch_mean_contrast.csv
prompt_columns:
  - rosch_example
  - rosch_neg
  - rosch_simple
  - rosch_fav
  - rosch_story_1
  - rosch_story_2
  - rosch_story_neg
# Layer L is the residual stream after transformer block L (hidden_states[L]).
layers: [10, 15, 20, 25]
# Only the period token. The item token comes before the category and the item
# text is the same in all categories, so the contrast at the item token is 0.
positions: [period]
n_components: 3
# Also fit one PCA for each category, on the rows of that category only. The
# HTML uses it when one category is selected. "All categories" uses the PCA
# fitted on all rows.
per_category_pca: true
# a(i, c) - mean over all c' != c of a(i, c'). See src/typicality_linearity/baselines.py.
# Categories c' in which the item is also rated are not excluded.
baseline: mean_contrast
# Also fit PCA on the same points without the baseline (the raw target-row
# activations). The HTML shows both PCAs side by side.
compare_no_baseline: true
# Point colour. Low z-score = typical.
color_by: rating_zscore
batch_size: 16
device: auto
dtype: float32
# Token put before every prompt. Qwen2.5 adds no start token, so without this
# an item at the start of a prompt is an attention sink. null adds no token.
prefix_token: "<|endoftext|>"
seed: 0
# Shared cache, used again by later runs with the same model, dtype, layers,
# positions and prompts. null turns the cache off.
activation_cache_dir: outputs/activation_cache
# null uses all rows. For a quick test, use a multiple of 10 so that each item
# has all its categories.
max_rows: null
output_dir: outputs/pca/rosch/qwen2-5-1-5B/mean-contrast
html_name: qwen2-5-1-5B-mean_contrast-baseline.html
